commands:
  - name: "app"
    run: "AWS_ENDPOINT_URL=http://localhost:$(./versitygw.sh port versitygw) go run -tags sqlite_fts5,sqlite_math_functions ./cmd/app"
    watch:
      - "**/*.go"
      - "go.mod"
      - ".env"

  - name: "tailwind"
    run: "./tailwindcss -i tailwind.css -o public/styles/app.css"
    watch:
      - "html/*.go"
      - "tailwind.css"

  - name: "versitygw"
    run: "./versitygw.sh dev"
    watch:
      - "versitygw.sh"
